name: Release

# Publicar una versión = subir una etiqueta:  git tag v1.2.0 && git push origin v1.2.0
# Ver docs/releases.md (spec 006, FR-006-01…03).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: La etiqueta debe coincidir con aura.versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^aura\.versionName=//p' gradle.properties)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::La etiqueta es '$tag' pero gradle.properties declara '$declared'"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto RELEASE_KEYSTORE_BASE64 (ver docs/releases.md)"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Tests, lint y APK firmado
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint testDebugUnitTest :domain:test assembleRelease

      - name: Verificar firma y calcular sumas
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk)"
          mkdir -p dist
          cp "$apk" "dist/aura-${VERSION}.apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "dist/aura-${VERSION}.apk" | tee dist/signature.txt
          grep -q "Signer #1 certificate SHA-256" dist/signature.txt
          (cd dist && sha256sum "aura-${VERSION}.apk" > "aura-${VERSION}.apk.sha256")
          cat "dist/aura-${VERSION}.apk.sha256"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt)"
          {
            echo "**Huella SHA-256 del certificado de firma** (debe ser siempre la misma):"
            echo
            echo "\`$cert\`"
          } > dist/notes-footer.md

      - name: Publicar la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aura-${{ env.VERSION }}.apk
            dist/aura-${{ env.VERSION }}.apk.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: dist/notes-footer.md
